<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký khóa học - SMC Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 0 20px}
.header img{height:40px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:24px}
h1{font-size:24px;font-weight:800;margin-bottom:8px}
h2{font-size:18px;font-weight:700;margin-bottom:16px;text-transform:uppercase;font-size:14px;border-bottom:1px solid #e2e8f0;padding-bottom:8px}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
label .req{color:#ef4444}
input,select,textarea{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:Inter,system-ui,sans-serif;outline:none;transition:border .2s}
input:focus,select:focus{border-color:#0B63CE;box-shadow:0 0 0 3px rgba(11,99,206,.1)}
.check-group{padding:12px;border:1px solid #e2e8f0;border-radius:8px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.check-group:hover{border-color:#cbd5e1}
.check-group input[type=checkbox]{width:18px;height:18px;accent-color:#0B63CE}
.amber-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;background:#0B63CE;color:#fff;font-weight:600;padding:12px 32px;border-radius:10px;border:none;font-size:16px;cursor:pointer;transition:background .2s}
.btn:hover{background:#0850a8}
.footer{text-align:center;padding:20px;color:#94a3b8;font-size:13px}
.success{text-align:center;padding:40px}
.success svg{width:64px;height:64px;color:#22c55e;margin-bottom:16px}
.toast{position:fixed;top:20px;right:20px;background:#ef4444;color:#fff;padding:12px 24px;border-radius:8px;font-weight:500;z-index:9999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="footer">Trung tâm Đào tạo Ứng dụng Công nghệ SMC<br>Số 59 Nguyễn Thị Hoa, Xã Đất Đỏ, TP.HCM<br>📞 1900 638939 | ✉️ support@smartconnect.com.vn</div>

<script>
const form = {
  fullName:'', nationality:'Việt Nam', dob:'', gender:'Nam',
  permanentAddress:'', currentAddress:'',
  idNumber:'', idIssueDate:'', idIssuePlace:'',
  phone:'', email:'', course:'Hạng A',
  healthCert:false, photos:false, passport:false, cv:false, criminalRecord:false
};

function showToast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}

function handleSubmit(e){
  e.preventDefault();
  if(!form.fullName||!form.dob||!form.idNumber||!form.phone){showToast('Vui lòng điền đầy đủ các trường bắt buộc (*)');return}

  var submitBtn = document.querySelector('.btn');
  var originalText = submitBtn.innerHTML;
  submitBtn.innerHTML = '<span class="spinner"></span> Đang gửi...';
  submitBtn.disabled = true;

  // Gửi lên API server
  fetch('/api/auth.php?action=registrations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      fullName: form.fullName,
      nationality: form.nationality,
      dob: form.dob,
      gender: form.gender,
      permanentAddress: form.permanentAddress,
      currentAddress: form.currentAddress,
      idNumber: form.idNumber,
      idIssueDate: form.idIssueDate,
      idIssuePlace: form.idIssuePlace,
      phone: form.phone,
      email: form.email,
      course: form.course,
      healthCert: form.healthCert,
      photos: form.photos,
      passport: form.passport,
      cv: form.cv,
      criminalRecord: form.criminalRecord
    })
  })
  .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, status: res.status, data: data }; }); })
  .then(function(result) {
    var data = result.data;
    if (result.ok && data.success) {
      document.getElementById('app').innerHTML='<div class="success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><h2>Đã gửi đơn đăng ký!</h2><p style="color:#64748b;margin:16px 0">Trung tâm SMC sẽ liên hệ với bạn trong thời gian sớm nhất.</p><p style="color:#94a3b8;font-size:13px">Mã đơn: <strong>' + data.id + '</strong></p><div class="card" style="text-align:left"><p><strong>📞 Hotline:</strong> 1900 638939</p><p><strong>📧 Email:</strong> support@smartconnect.com.vn</p><p><strong>📍 Địa chỉ:</strong> 59 Nguyễn Thị Hoa, Xã Đất Đỏ, TP.HCM</p></div></div>';
    } else {
      // Hiển thị lỗi từ API (bao gồm lỗi trùng lặp email/SĐT)
      showToast(data.error || 'Lỗi không xác định');
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
    }
  })
  .catch(function(err) {
    showToast('Lỗi khi gửi đơn: ' + err.message + '. Vui lòng thử lại hoặc gọi hotline 1900 638939.');
    submitBtn.innerHTML = originalText;
    submitBtn.disabled = false;
  });
}

function render(){
  var f=form;
  document.getElementById('app').innerHTML=
'<div class="header"><img src="/logo.svg" alt="SMC Training"><h1>ĐƠN ĐỀ NGHỊ</h1><p style="font-size:18px;font-weight:700">Học, cấp Giấy phép điều khiển phương tiện bay</p><div class="badge">Mẫu số 07 — Nghị định 288/2025/NĐ-CP</div><p style="color:#64748b">Kính gửi: Trung tâm Đào tạo Ứng dụng Công nghệ SMC</p></div>'+
'<form onsubmit="handleSubmit(event)">'+
'<div class="card"><h2>I. Thông tin cá nhân</h2>'+
'<div class="grid2"><div style="grid-column:1/-1"><label>Họ và tên <span class="req">*</span></label><input value="'+f.fullName+'" oninput="form.fullName=this.value" required></div>'+
'<div><label>Quốc tịch</label><input value="'+f.nationality+'" oninput="form.nationality=this.value"></div>'+
'<div><label>Ngày sinh <span class="req">*</span></label><input type="date" value="'+f.dob+'" onchange="form.dob=this.value" required></div>'+
'<div><label>Giới tính</label><select onchange="form.gender=this.value"><option '+(f.gender==="Nam"?"selected":"")+'>Nam</option><option '+(f.gender==="Nữ"?"selected":"")+'>Nữ</option></select></div>'+
'</div></div>'+
'<div class="card"><h2>II. Địa chỉ</h2>'+
'<div><label>Nơi đăng ký hộ khẩu thường trú</label><input value="'+f.permanentAddress+'" oninput="form.permanentAddress=this.value" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/TP"></div>'+
'<div style="margin-top:12px"><label>Nơi cư trú hiện tại</label><input value="'+f.currentAddress+'" oninput="form.currentAddress=this.value" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/TP"></div>'+
'</div>'+
'<div class="card"><h2>III. Giấy tờ tùy thân</h2>'+
'<div class="grid3"><div><label>Số CCCD/CMND/Hộ chiếu <span class="req">*</span></label><input value="'+f.idNumber+'" oninput="form.idNumber=this.value" required></div>'+
'<div><label>Ngày cấp</label><input type="date" value="'+f.idIssueDate+'" onchange="form.idIssueDate=this.value"></div>'+
'<div><label>Nơi cấp</label><input value="'+f.idIssuePlace+'" oninput="form.idIssuePlace=this.value"></div></div></div>'+
'<div class="card"><h2>IV. Liên hệ & Khóa học</h2>'+
'<div class="grid3"><div><label>Số điện thoại <span class="req">*</span></label><input type="tel" value="'+f.phone+'" oninput="form.phone=this.value" required></div>'+
'<div><label>Email</label><input type="email" value="'+f.email+'" oninput="form.email=this.value"></div>'+
'<div><label>Khóa học đăng ký</label><select onchange="form.course=this.value"><option '+(f.course==="Hạng A"?"selected":"")+'>Hạng A — VLOS</option><option '+(f.course==="Hạng B VLOS"?"selected":"")+'>Hạng B — VLOS</option><option '+(f.course==="Hạng B BVLOS"?"selected":"")+'>Hạng B — BVLOS</option></select></div></div></div>'+
'<div class="card"><h2>V. Hồ sơ đính kèm</h2>'+
['01 Giấy chứng nhận đủ sức khỏe','02 Ảnh màu cỡ 3cm × 4cm','Bản sao Hộ chiếu (nước ngoài)','Sơ yếu lý lịch','Phiếu lý lịch tư pháp'].map(function(t,i){var k=["healthCert","photos","passport","cv","criminalRecord"][i];return'<label class="check-group"><input type="checkbox" '+(f[k]?"checked":"")+' onchange="form.'+k+'=this.checked">'+t+'</label>'}).join('')+
'<p style="font-size:12px;color:#94a3b8;margin-top:8px">Tích chọn để xác nhận. Bản gốc nộp khi đến trung tâm.</p></div>'+
'<div class="amber-box" style="margin-bottom:24px"><p style="font-size:14px;color:#92400e"><strong>Tôi cam đoan</strong> những điều ghi trên là đúng sự thật, nếu sai tôi xin hoàn toàn chịu trách nhiệm.</p></div>'+
'<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px;color:#94a3b8"><p>📞 Hotline: <strong>1900 638939</strong></p><p>📧 <strong>support@smartconnect.com.vn</strong></p></div><button type="submit" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Gửi đơn đăng ký</button></div>'+
'</form>';
}
render();
</script>
</body>
</html>
