name: Deploy to Plesk Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: s88d71.cloudnetwork.vn
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: httpdocs/
          exclude: |
            **/.git*
            **/.git/**
            **/node_modules/**
            **/.claude/**
            **/package-lock.json
            **/vite.config.js
            **/tailwind.config.js
            **/postcss.config.js
            **/src/**
            **/database/**
            **/backups/**
            **/*.md
            **/.env.example
            **/.gitignore
            **/tailwindcss-*
            **/*.bak
